[tox]
envlist = py313
isolated_build = false

[coverage:run]
relative_files = true
source =
    audio
    chipsets
    cpu
    devices
    frontend
    machines
    multiemu
    video
omit =
    tests/*
    build/*
    .tox/*
    .venv/*

[coverage:report]
show_missing = true
skip_covered = false
precision = 1

[testenv]
description = Run the full pytest suite with coverage and show missing lines
package = skip
deps =
    cython>=3.0
    coverage
    setuptools>=68
    wheel
    pytest
    pygame
    numpy
commands_pre =
    python setup.py build_ext --inplace
commands =
    coverage erase
    coverage run -m pytest -q
    coverage report -m

[testenv:clean]
description = Remove generated artifacts from the project tree without touching .git or .venv
package = skip
deps =
commands =
    python -c "from pathlib import Path; import shutil; root = Path('.').resolve(); skip = {root / '.git', root / '.venv'}; removable_dirs = {'__pycache__', 'build', '.pytest_cache', '.tox', 'multiemu.egg-info'}; removable_files = {'.coverage', 'coverage.xml', 'coverage.json', 'coverage.lcov'}; removable_suffixes = {'.pyc', '.so', '.pyd', '.dll', '.dylib'}; exec(\"\"\"for path in sorted(root.rglob('*'), key=lambda p: (len(p.parts), str(p)), reverse=True):\n    if any(parent in skip for parent in (path, *path.parents)):\n        continue\n    if path.is_dir() and path.name in removable_dirs:\n        shutil.rmtree(path)\n        continue\n    if not path.is_file():\n        continue\n    if path.name in removable_files or path.suffix in removable_suffixes:\n        path.unlink()\n        continue\n    if path.suffix == '.c' and path.with_suffix('.pyx').exists():\n        path.unlink()\n\"\"\")"
